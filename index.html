<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vestr - Gestão de Investimentos</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Syne:wght@500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            marca: {
              50: '#fafaf8',
              100: '#f5f5ec',
              200: '#e8e6d4',
              300: '#d4d0ae',
              400: '#c2bd85',
              500: '#b5ab64',
              600: '#a89a4d',
              700: '#8c7d3e',
              800: '#756635',
              900: '#5f502c',
            },
            dourado: '#D4AF37',
            escuro: '#0A0A0A',
            claro: '#FAFAFA',
          },
          fontFamily: {
            display: ['Syne', 'sans-serif'],
            body: ['DM Sans', 'sans-serif'],
          },
          boxShadow: {
            'app': '0 25px 50px -12px rgba(0, 0, 0, 0.35)',
            'card': '0 4px 20px rgba(0, 0, 0, 0.08)',
            'btn': '0 2px 8px rgba(212, 175, 55, 0.3)',
          },
          borderRadius: {
            'app': '40px',
          },
          animation: {
            'fade-in': 'fadeIn 0.3s ease-out',
            'slide-up': 'slideUp 0.3s ease-out',
          },
        },
      },
    }
  </script>
  <style>
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    [data-tela]:not(.hidden) {
      animation: fadeIn 0.25s ease-out, slideUp 0.25s ease-out;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: linear-gradient(145deg, #1a1a1a 0%, #0A0A0A 100%);
      min-height: 100vh;
    }

    .app-container {
      max-width: 430px;
      margin: 0 auto;
      min-height: 100vh;
      position: relative;
      background: #0A0A0A;
      box-shadow: 0 25px 80px -20px rgba(0, 0, 0, 0.6);
    }

    @media (min-width: 450px) {
      .app-container {
        margin: 20px auto;
        min-height: calc(100vh - 40px);
        border-radius: 40px;
        overflow: hidden;
        border: 1px solid #222;
      }
    }

    .nav-btn {
      transition: all 0.2s ease;
    }

    .nav-btn.ativo {
      color: #D4AF37;
    }

    .nav-btn.ativo svg {
      transform: scale(1.1);
    }

    .nav-btn:active {
      transform: scale(0.95);
    }

    .btn {
      background: linear-gradient(135deg, #D4AF37 0%, #b8962e 100%);
      color: #0A0A0A;
      font-weight: 600;
      padding: 12px 24px;
      border-radius: 12px;
      transition: all 0.2s ease;
      box-shadow: 0 2px 12px rgba(212, 175, 55, 0.35);
    }

    .btn:active {
      transform: scale(0.97);
      box-shadow: 0 1px 6px rgba(212, 175, 55, 0.3);
    }

    .btn-outline {
      background: transparent;
      border: 1.5px solid #D4AF37;
      color: #D4AF37;
      box-shadow: none;
    }

    .card {
      background: linear-gradient(145deg, #141414 0%, #0f0f0f 100%);
      border: 1px solid #1f1f1f;
      border-radius: 16px;
      padding: 16px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .badge.positivo {
      background: rgba(34, 197, 94, 0.15);
      color: #22c55e;
    }

    .badge.negativo {
      background: rgba(239, 68, 68, 0.15);
      color: #ef4444;
    }

    .badge.neutral {
      background: rgba(212, 175, 55, 0.15);
      color: #D4AF37;
    }

    input, select {
      background: #141414;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 14px 16px;
      color: #FAFAFA;
      width: 100%;
      font-size: 15px;
      transition: all 0.2s ease;
    }

    input:focus, select:focus {
      outline: none;
      border-color: #D4AF37;
      box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.15);
    }

    input::placeholder {
      color: #666;
    }

    .status-bar {
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      background: #0A0A0A;
      border-bottom: 1px solid #1a1a1a;
    }

    .scrollable {
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .scrollable::-webkit-scrollbar {
      width: 4px;
    }

    .scrollable::-webkit-scrollbar-track {
      background: transparent;
    }

    .scrollable::-webkit-scrollbar-thumb {
      background: #333;
      border-radius: 2px;
    }

    .toast-container {
      position: fixed;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }

    .toast {
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 500;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      animation: slideUp 0.3s ease-out;
      max-width: 340px;
      text-align: center;
    }

    .toast.ok {
      background: #166534;
      color: #dcfce7;
    }

    .toast.erro {
      background: #991b1b;
      color: #fee2e2;
    }

    .toast.info {
      background: #1e3a5f;
      color: #dbeafe;
    }

    #modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 20px;
      opacity: 0;
      visibility: hidden;
      transition: all 0.25s ease;
    }

    #modal-overlay.aberto {
      opacity: 1;
      visibility: visible;
    }

    #modal-content {
      background: #141414;
      border: 1px solid #2a2a2a;
      border-radius: 24px;
      width: 100%;
      max-width: 380px;
      max-height: 80vh;
      overflow: hidden;
      transform: scale(0.9);
      transition: transform 0.25s ease;
    }

    #modal-overlay.aberto #modal-content {
      transform: scale(1);
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
      color: #0A0A0A;
    }

    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, #2a2a2a, transparent);
    }

    h1, h2, h3 {
      font-family: 'Syne', sans-serif;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- Status Bar -->
    <div class="status-bar">
      <span style="font-size: 13px; font-weight: 600; color: #FAFAFA;">9:41</span>
      <div style="display: flex; gap: 6px; align-items: center;">
        <svg width="18" height="12" viewBox="0 0 18 12" fill="none">
          <rect x="0" y="0" width="18" height="12" rx="2" stroke="#FAFAFA" stroke-width="1.5"/>
          <rect x="2" y="4" width="10" height="4" rx="1" fill="#FAFAFA"/>
          <rect x="14" y="5" width="2" height="2" rx="0.5" fill="#FAFAFA"/>
        </svg>
        <svg width="20" height="10" viewBox="0 0 20 10" fill="none">
          <rect x="0" y="0" width="20" height="10" rx="2" stroke="#FAFAFA" stroke-width="1.5"/>
          <rect x="2" y="2" width="12" height="6" rx="1" fill="#FAFAFA"/>
        </svg>
      </div>
    </div>

    <!-- Header -->
    <header style="padding: 16px 20px; background: #0A0A0A; border-bottom: 1px solid #1a1a1a;">
      <div style="display: flex; align-items: center; gap: 12px;">
        <div style="width: 40px; height: 40px; background: linear-gradient(135deg, #D4AF37 0%, #a08930 100%); border-radius: 12px; display: flex; align-items: center; justify-content: center;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
            <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="#0A0A0A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M2 17L12 22L22 17" stroke="#0A0A0A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M2 12L12 17L22 12" stroke="#0A0A0A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div>
          <h1 style="font-size: 18px; font-weight: 700; color: #FAFAFA; letter-spacing: -0.5px;">Vestr</h1>
          <p style="font-size: 11px; color: #666; letter-spacing: 1px; text-transform: uppercase;">Global Investments</p>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="scrollable" style="padding-bottom: 100px; min-height: calc(100vh - 180px);">
      <!-- TELAS -->
    </main>

    <!-- Bottom Navigation -->
    <nav style="position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 430px; background: linear-gradient(180deg, #0f0f0f 0%, #0A0A0A 100%); border-top: 1px solid #1f1f1f; padding: 8px 8px 24px 8px; display: flex; justify-content: space-around; z-index: 100;">
      <button class="nav-btn" data-nav="painel-de-investimentos" onclick="mostrarTela('painel-de-investimentos')" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 12px; background: none; border: none; color: #666;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7" rx="1"/>
          <rect x="14" y="3" width="7" height="7" rx="1"/>
          <rect x="14" y="14" width="7" height="7" rx="1"/>
          <rect x="3" y="14" width="7" height="7" rx="1"/>
        </svg>
        <span style="font-size: 10px; font-weight: 500;">Painel</span>
      </button>
      <button class="nav-btn" data-nav="carteira-de-ativos" onclick="mostrarTela('carteira-de-ativos')" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 12px; background: none; border: none; color: #666;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
          <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
          <line x1="12" y1="22.08" x2="12" y2="12"/>
        </svg>
        <span style="font-size: 10px; font-weight: 500;">Carteira</span>
      </button>
      <button class="nav-btn" data-nav="historico-de-transacoes" onclick="mostrarTela('historico-de-transacoes')" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 12px; background: none; border: none; color: #666;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
        </svg>
        <span style="font-size: 10px; font-weight: 500;">Histórico</span>
      </button>
      <button class="nav-btn" data-nav="suporte-e-chat" onclick="mostrarTela('suporte-e-chat')" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 12px; background: none; border: none; color: #666;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
        <span style="font-size: 10px; font-weight: 500;">Suporte</span>
      </button>
      <button class="nav-btn" data-nav="meu-perfil" onclick="mostrarTela('meu-perfil')" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 12px; background: none; border: none; color: #666;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <span style="font-size: 10px; font-weight: 500;">Perfil</span>
      </button>
    </nav>
  </div>

  <!-- Toast Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Modal -->
  <div id="modal-overlay" onclick="fecharModal(event)">
    <div id="modal-content" onclick="event.stopPropagation()">
      <div id="modal-header" style="padding: 20px; border-bottom: 1px solid #2a2a2a; display: flex; justify-content: space-between; align-items: center;">
        <h3 id="modal-title" style="font-size: 17px; font-weight: 600; color: #FAFAFA; margin: 0;">Título</h3>
        <button onclick="fecharModal()" style="background: none; border: none; color: #666; padding: 4px; cursor: pointer;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div id="modal-body" style="padding: 20px; overflow-y: auto; max-height: 60vh;"></div>
    </div>
  </div>

  <script>
    // Utilities
    function brl(valor) {
      return new Intl.NumberFormat('pt-BR', {
        style: 'currency',
        currency: 'BRL'
      }).format(valor);
    }

    function dataBR(iso) {
      const d = new Date(iso);
      return d.toLocaleDateString('pt-BR');
    }

    function toast(mensagem, tipo = 'info') {
      const container = document.getElementById('toast-container');
      const el = document.createElement('div');
      el.className = `toast ${tipo}`;
      el.textContent = mensagem;
      container.appendChild(el);
      setTimeout(() => el.remove(), 3000);
    }

    function abrirModal(html, titulo = 'Detalhes') {
      document.getElementById('modal-title').textContent = titulo;
      document.getElementById('modal-body').innerHTML = html;
      document.getElementById('modal-overlay').classList.add('aberto');
    }

    function fecharModal(e) {
      if (e && e.target !== e.currentTarget) return;
      document.getElementById('modal-overlay').classList.remove('aberto');
    }

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') fecharModal();
    });

    // Router
    function mostrarTela(id) {
      document.querySelectorAll('[data-tela]').forEach(function (s) {
        s.classList.toggle('hidden', s.dataset.tela !== id);
      });
      document.querySelectorAll('[data-nav]').forEach(function (b) {
        b.classList.toggle('ativo', b.dataset.nav === id);
      });
      window.scrollTo({ top: 0 });
    }

    document.addEventListener('DOMContentLoaded', function () {
      mostrarTela('painel-de-investimentos');
    });
  </script>
</body>
</html>
