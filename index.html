<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>AURUM</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Karla:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            marca: {
              50:'#FAF8F0',100:'#F5F0D0',200:'#EDE5A0',
              300:'#E5DA70',400:'#D4AF37',500:'#C49B2A',
              600:'#A88120',700:'#806518',800:'#604C12',
              900:'#403208',950:'#2A1F04'
            },
            txt: {50:'#FAFAFA',100:'#E5E5E5',200:'#BFBFBF',
              300:'#999',400:'#666',500:'#4A4A4A',600:'#2E2E2E',
              700:'#1A1A1A',800:'#111',900:'#0A0A0A'}
          },
          fontFamily: {'display':['"DM Serif Display"','Georgia','serif'],
                       'body':['Karla','system-ui','sans-serif']},
          boxShadow: {
            'sm':'0 1px 3px rgba(0,0,0,0.06)','card':'0 2px 12px rgba(0,0,0,0.08)',
            'card-h':'0 8px 32px rgba(0,0,0,0.12)','nav':'0 -2px 16px rgba(0,0,0,0.07)',
            'gold':'0 2px 12px rgba(212,175,55,0.18)','gold-l':'0 4px 20px rgba(212,175,55,0.28)'
          },
          borderRadius: {'card':'16px','nav':'14px','btn':'10px'}
        }
      }
    }
  </script>
  <style>
    *{-webkit-tap-highlight-color:transparent}
    html,body{margin:0;height:100%;overflow:hidden;background:#060606}
    body{font-family:'Karla',system-ui,sans-serif;color:#FAFAFA;display:flex;
         align-items:center;justify-content:center}

    ::-webkit-scrollbar{width:2.5px}
    ::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:rgba(212,175,55,0.18);border-radius:2px}
    *:focus-visible{outline:2px solid #D4AF37;outline-offset:2px;border-radius:6px}

    [data-tela]{animation:telaIn .32s cubic-bezier(.4,0,.2,1) both}
    @keyframes telaIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
    [data-tela].hidden{display:none!important;animation:none}

    .badge{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;
           border-radius:9999px;font-size:11px;font-weight:700;letter-spacing:.3px;text-transform:uppercase}
    .card{background:#111;border:1px solid #1E1E1E;border-radius:16px;
          padding:16px;transition:box-shadow .2s,border-color .2s}
    .card:active{box-shadow:card-h;border-color:rgba(212,175,55,.15)}
    .btn{display:flex;align-items:center;justify-content:center;gap:8px;
         width:100%;padding:14px 20px;border:none;border-radius:10px;
         font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;
         transition:transform .12s,box-shadow .2s,opacity .2s}
    .btn:active{transform:scale(.97)}
    .btn-ghost{background:transparent;color:#D4AF37;
               border:1.5px solid rgba(212,175,55,.35)}
    .btn-ghost:hover{background:rgba(212,175,55,.06)}

    .nav-btn{display:flex;flex-direction:column;align-items:center;gap:3px;
             padding:6px 0 4px;background:none;border:none;color:#555;
             font-size:10px;font-weight:600;cursor:pointer;min-width:56px;
             transition:color .2s}
    .nav-btn.ativo{color:#D4AF37}
    .nav-btn svg{width:22px;height:22px;transition:transform .15s}
    .nav-btn.ativo svg{transform:scale(1.08)}
    .nav-btn::before{content:'';position:absolute;top:-2px;left:50%;
                     transform:translateX(-50%) scaleX(0);width:22px;height:2.5px;
                     background:#D4AF37;border-radius:2px;transition:transform .25s}
    .nav-btn.ativo::before{transform:translateX(-50%) scaleX(1)}

    #moldura{width:390px;height:100dvh;background:#060606;position:relative;
             overflow:hidden;border-left:1px solid #1A1A1A;border-right:1px solid #1A1A1A}
    @media(min-width:431px){
      #moldura{height:min(844px,100dvh);border-radius:44px;
               border:3px solid #1A1A1A;box-shadow:0 0 0 1px #2A2A2A,0 20px 70px rgba(0,0,0,.6)}
    }

    #app{display:flex;flex-direction:column;height:100dvh;width:100%;
         position:relative;overflow:hidden}
    #barra-status{height:env(safe-area-inset-top,44px);min-height:44px;
                  display:flex;align-items:flex-end;justify-content:space-between;
                  padding:0 28px 8px;background:#060606;flex-shrink:0;z-index:60}
    #cabecalho{height:52px;background:#060606;border-bottom:1px solid #141414;
               display:flex;align-items:center;padding:0 20px;gap:14px;
               flex-shrink:0;position:relative;z-index:50}
    #principal{flex:1;overflow-y:auto;overflow-x:hidden;padding:20px 18px 8px;
               scroll-behavior:smooth;position:relative}
    #nav{height:68px;background:#060606;border-top:1px solid #141414;
         display:flex;align-items:center;justify-content:space-around;
         padding-bottom:env(safe-area-inset-bottom,0);flex-shrink:0;position:relative;z-index:60}

    #toasts{position:absolute;top:8px;left:8px;right:8px;z-index:200;
             display:flex;flex-direction:column;gap:8px;pointer-events:none}
    .toast{pointer-events:auto;animation:tIn .28s ease-out both;
           display:flex;align-items:center;gap:10px;padding:13px 16px;
           border-radius:12px;font-size:13px;font-weight:600}
    .toast.sair{animation:tOut .25s ease-in both}
    @keyframes tIn{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}
    @keyframes tOut{to{opacity:0;transform:translateY(-12px)}}

    #modal-bg{position:absolute;inset:0;background:rgba(0,0,0,.65);z-index:180;
              display:none;align-items:flex-end;justify-content:center;
              backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
    #modal-bg.aberto{display:flex}
    #modal-card{background:#111;border-top:1px solid #222;border-radius:22px 22px 0 0;
                width:100%;max-height:82%;overflow-y:auto;padding:10px 24px 34px;
                animation:mIn .28s cubic-bezier(.4,0,.2,1)}
    @keyframes mIn{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
  </style>
</head>
<body>
  <div id="moldura">
    <div id="app">

      <!-- BARRA DE STATUS -->
      <div id="barra-status">
        <span id="h-ora" class="font-body text-txt-400 text-xs font-bold tracking-wide"></span>
        <svg width="78" height="12" viewBox="0 0 78 12" fill="none" class="opacity-80">
          <path d="M1 8.5C1 6.5 2.5 4.8 4.5 4.1V1.8C4.5 1.3 4.9.9 5.5.9H6.5C7 .9 7.4 1.3 7.4 1.8V4.2C9.3 5 11 6.6 11 8.6C11 9.1 10.6 9.5 10.1 9.5H1.9C1.4 9.5 1 9.1 1 8.6V8.5Z"
                fill="#FAFAFA" opacity=".85"/>
          <rect x="13" y="3.5" width="50" height="5" rx="1" fill="#FAFAFA" opacity=".28"/>
          <rect x="14" y="4" width="41" height="4.5" rx="1" fill="#FAFAFA" opacity=".65"/>
          <path d="M65 4.2V8.2C65 8.7 64.6 9.1 64.1 9.1C63.6 9.1 63.2 8.7 63.2 8.2V4.2C63.2 3.7 63.6 3.3 64.1 3.3C64.6 3.3 65 3.7 65 4.2Z"
                fill="#FAFAFA" opacity=".35"/>
          <rect x="67" y="5.5" width="6" height="4" rx="1" fill="#FAFAFA" opacity=".35"/>
          <rect x="68" y="5.75" width="4" height="3.5" rx=".5" fill="#FAFAFA" opacity=".65"/>
        </svg>
      </div>

      <!-- CABEÇALHO -->
      <div id="cabecalho">
        <div class="flex items-center gap-2.5">
          <svg width="30" height="30" viewBox="0 0 32 32" fill="none">
            <rect width="32" height="32" rx="8" fill="#0A0A0A" stroke="#D4AF37" stroke-width="1.5"/>
            <path d="M9 22V12L16 7l7 5v10l-7-5-7 5z" fill="#D4AF37" opacity=".9"/>
            <path d="M16 14v8M12 16.5l4 2 4-2" stroke="#0A0A0A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span class="font-display text-xl text-txt-50 tracking-wide">AURUM</span>
        </div>
        <div class="flex-1"></div>
        <button data-nav="notificacoes-e-alertas" onclick="mostrarTela('notificacoes-e-alertas')"
                class="relative p-1.5 rounded-full hover:bg-white/5 transition-colors" aria-label="Notificações">
          <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
            <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 01-3.46 0"/>
          </svg>
          <span class="absolute top-1 right-1 w-2 h-2 bg-marca-400 rounded-full"></span>
        </button>
      </div>

      <!-- CONTEÚDO -->
      <main id="principal">
        <!-- TELAS -->
      </main>

      <!-- NAVEGAÇÃO -->
      <nav id="nav">
        <button class="nav-btn" data-nav="painel-de-investimentos" onclick="mostrarTela('painel-de-investimentos')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
            <rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/>
          </svg>
          <span>Painel</span>
        </button>
        <button class="nav-btn" data-nav="catalogo-de-investimentos" onclick="mostrarTela('catalogo-de-investimentos')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
          </svg>
          <span>Catálogo</span>
        </button>
        <button class="nav-btn" data-nav="detalhe-do-ativo" onclick="mostrarTela('detalhe-do-ativo')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2v4M12 18v4M4.9 4.9l2.8 2.8M16.2 16.2l2.8 2.8M2 12h4M18 12h4M4.9 19.1l2.8-2.8M16.2 7.8l2.8-2.8"/>
            <circle cx="12" cy="12" r="4"/>
          </svg>
          <span>Ativo</span>
        </button>
        <button class="nav-btn" data-nav="confirmar-aporte" onclick="mostrarTela('confirmar-aporte')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <path d="M12 6v12M8 10l4-4 4 4"/>
          </svg>
          <span>Aporte</span>
        </button>
        <button class="nav-btn" data-nav="minha-carteira" onclick="mostrarTela('minha-carteira')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12V7H5a2 2 0 010-4h14v4"/><path d="M3 5v14a2 2 0 002 2h16v-5"/>
            <path d="M18 12a2 2 0 100 4 2 2 0 000-4z"/>
          </svg>
          <span>Carteira</span>
        </button>
        <button class="nav-btn" data-nav="notificacoes-e-alertas" onclick="mostrarTela('notificacoes-e-alertas')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 8a6 6 0 0112 0v5a2 2 0 01-2 2h-1a2 2 0 01-2-2v-.5a3.5 3.5 0 00-7 0V16a2 2 0 01-2 2H4a2 2 0 01-2-2V8z"/>
            <path d="M10 21a1.94 1.94 0 003.9 0"/>
          </svg>
          <span>Alertas</span>
        </button>
        <button class="nav-btn" data-nav="painel-administrativo" onclick="mostrarTela('painel-administrativo')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/>
          </svg>
          <span>Admin</span>
        </button>
        <button class="nav-btn" data-nav="perfil-e-configuracoes" onclick="mostrarTela('perfil-e-configuracoes')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0112 0v1"/>
          </svg>
          <span>Perfil</span>
        </button>
        <button class="nav-btn" data-nav="chat-de-suporte" onclick="mostrarTela('chat-de-suporte')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>
          </svg>
          <span>Suporte</span>
        </button>
      </nav>

      <!-- TOASTS -->
      <div id="toasts"></div>

      <!-- MODAL -->
      <div id="modal-bg" onclick="fecharModal()">
        <div id="modal-card" onclick="event.stopPropagation()">
          <div class="flex items-center justify-between mb-5">
            <h3 id="modal-titulo" class="font-display text-xl text-txt-50"></h3>
            <button onclick="fecharModal()" class="p-1.5 -mr-1.5 rounded-full hover:bg-white/5 transition-colors" aria-label="Fechar">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
            </button>
          </div>
          <div id="modal-corpo"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    var _tm,_tv;
    function toast(m,t){
      var c=document.getElementById('toabs');
      var el=document.createElement('div');
      var bg=t==='ok'?'bg-green-900/90 text-green-200':t==='erro'?'bg-red-900/90 text-red-200':'bg-marca-900/90 text-marca-200';
      var ico=t==='ok'?'M5 13l4 4L19 7':t==='erro'?'M6 18L18 6M6 6l12 12':'M13 16h-1v-6h-1m0-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z';
      el.className='toast '+bg;
      el.style.backdropFilter='blur(12px)';
      el.innerHTML='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="'+ico+'"/></svg><span>'+m+'</span>';
      c.appendChild(el);
      clearTimeout(_tm);_tv=null;
      setTimeout(function(){el.classList.add('sair');setTimeout(function(){el.remove()},260)},3000);
    }
    function abrirModal(h,t){
      document.getElementById('modal-titulo').textContent=t;
      document.getElementById('modal-corpo').innerHTML=h;
      document.getElementById('modal-bg').classList.add('aberto');
    }
    function fecharModal(){
      document.getElementById('modal-bg').classList.remove('aberto');
    }
    document.addEventListener('keydown',function(e){if(e.key==='Escape')fecharModal()});

    function brl(v){
      return'R$ '+Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
    }
    function dataBR(d){
      var p=d.split('-');if(p.length!==3)return d;
      return p[2]+'/'+p[1]+'/'+p[0];
    }

    function mostrarTela(id){
      document.querySelectorAll('[data-tela]').forEach(function(s){
        s.classList.toggle('hidden',s.dataset.tela!==id);
      });
      document.querySelectorAll('[data-nav]').forEach(function(b){
        b.classList.toggle('ativo',b.dataset.nav===id);
      });
      window.scrollTo({top:0});
    }
    document.addEventListener('DOMContentLoaded',function(){
      mostrarTela('painel-de-investimentos');
    });
    (function(){var d=new Date();var h=d.getHours().toString().padStart(2,'0');
      var m=d.getMinutes().toString().padStart(2,'0');
      var el=document.getElementById('h-ora');
      if(el)el.textContent=h+':'+m;})();
  </script>
</body>
</html>
